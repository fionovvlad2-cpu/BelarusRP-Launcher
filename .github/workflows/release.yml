name: Release launcher

on:
  # Автоматически: git tag v1.0.1 && git push origin v1.0.1
  push:
    tags:
      - "v*"
  # Вручную: вкладка Actions -> Release launcher -> Run workflow
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write   # нужно, чтобы создать релиз и прикрепить файлы

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v','V')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Tag: $tag  Version: $ver"

      - name: Publish single-file exe (win-x64)
        shell: pwsh
        run: >
          dotnet publish src/BelarusRP.Launcher/BelarusRP.Launcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Check result
        shell: pwsh
        run: |
          if (-not (Test-Path publish/BelarusRP.exe)) { throw "publish/BelarusRP.exe not found" }
          Get-Item publish/BelarusRP.exe | Select-Object Name, Length

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/BelarusRP.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BelarusRP.exe" | Out-File -Encoding ascii publish/BelarusRP.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Belarus RP Launcher ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/BelarusRP.exe
            publish/BelarusRP.exe.sha256
