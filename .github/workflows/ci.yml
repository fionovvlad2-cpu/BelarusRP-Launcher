name: CI tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and test
        run: dotnet test tests/BelarusRP.Tests/BelarusRP.Tests.csproj -c Release
